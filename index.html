<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>BLACKOUT</title>
<meta property="og:title" content="BLACKOUT">
<meta property="og:description" content="Você decide o assunto de hoje.">
<meta property="og:image" content="https://midiaatos.github.io/blackout/logo-atos-one.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  --breu:#000000;
  --filamento:#FFE3B3;
  --brasa:#FF9F43;
  --apagado:#3A3632;
  --fumaca:#8C857C;
  --texto:#E6DCCD;
  --linha:#2A2622;
  --fonte:'Archivo','Arial Narrow',Impact,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%;background:var(--breu)}
body{color:var(--texto);font-family:var(--fonte);font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

.app{min-height:100%;max-width:32rem;margin:0 auto;padding:1.5rem 1.25rem 0;display:flex;flex-direction:column}

.topo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem;padding-top:.25rem}
.logo{display:block;height:1.75rem;width:auto;max-width:60%;object-fit:contain}
.logo-texto{font-weight:600;font-size:1rem;color:var(--fumaca)}
.marca{position:relative;z-index:0;max-width:100%;font-weight:900;font-stretch:62%;line-height:.82;color:var(--filamento);text-transform:uppercase;font-size:3.5rem;text-shadow:0 0 .02em rgba(255,240,215,.7)}
.marca::after{content:attr(data-texto);position:absolute;inset:0;z-index:-1;color:transparent;text-shadow:0 0 .06em var(--brasa),0 0 .25em rgba(255,159,67,.55),0 0 .6em rgba(255,159,67,.25);opacity:.4;animation:pulso 2.6s ease-in-out infinite;will-change:opacity;pointer-events:none}
.piscar{animation:piscar .7s linear 1}

body.heroi .app{justify-content:center;padding-bottom:3rem}
body.heroi .topo{gap:1.5rem}
body.heroi .logo{height:3rem}
body.heroi .marca{font-size:min(22vw,8.5rem)}

.tela{display:flex;flex-direction:column}
.tela[hidden]{display:none}
.mensagem{margin-top:2.25rem;text-align:center;align-items:center;gap:.5rem}
.mensagem-titulo{font-weight:800;font-stretch:75%;font-size:1.875rem;line-height:1.1;color:var(--filamento)}
.mensagem-texto{color:var(--fumaca);max-width:28ch}
.mensagem-texto strong{color:var(--texto);font-weight:700}
.numero{font-variant-numeric:tabular-nums}

.votar{margin-top:2rem;flex:1}
.chamada{font-weight:800;font-stretch:80%;font-size:1.875rem;line-height:1.08;color:var(--texto);text-wrap:balance}
.relogio-chip{margin-top:.6rem;color:var(--fumaca);font-size:.95rem}
.relogio-chip strong{color:var(--filamento);font-weight:700;font-variant-numeric:tabular-nums}
.opcoes{margin-top:1.5rem;border-top:1px solid var(--linha)}
.opcao{display:grid;grid-template-columns:1.25rem 1fr;gap:1rem;align-items:center;padding:1.15rem .25rem;border-bottom:1px solid var(--linha);cursor:pointer;position:relative}
.opcao input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.lampada{width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid var(--apagado);transition:background-color .2s,border-color .2s,box-shadow .25s}
.opcao input:focus-visible + .lampada{outline:2px solid var(--filamento);outline-offset:3px}
.opcao-nome{display:block;font-weight:700;font-stretch:85%;font-size:1.35rem;line-height:1.2;color:var(--texto);transition:color .2s}
.opcao.marcada .lampada{background:var(--filamento);border-color:var(--filamento);box-shadow:0 0 .5rem var(--brasa),0 0 1.4rem rgba(255,159,67,.45)}
.opcao.marcada .opcao-nome{color:var(--filamento)}

.acao{position:sticky;bottom:0;margin-top:1rem;padding:1rem 0 1.25rem;background:linear-gradient(to top,var(--breu) 72%,rgba(0,0,0,0))}
.botao{appearance:none;-webkit-appearance:none;width:100%;min-height:3.5rem;border:0;border-radius:.375rem;background:var(--filamento);color:#000;font:inherit;font-weight:800;font-stretch:85%;font-size:1.15rem;cursor:pointer;transition:background-color .2s,color .2s}
.botao:disabled{background:var(--apagado);color:var(--fumaca);cursor:default}
.botao:focus-visible{outline:2px solid var(--filamento);outline-offset:3px}

.frase{margin-top:1.25rem;max-width:26ch;font-weight:500;font-stretch:90%;font-size:1.25rem;line-height:1.4;color:var(--texto);text-wrap:balance}
.aviso{min-height:1.5em;margin-top:.6rem;font-size:.95rem;color:var(--filamento);text-align:center}
.lider{font-size:1.25rem;color:var(--fumaca);animation:respirar 2.4s ease-in-out infinite}
.sem-sinal{font-size:.9rem;color:var(--fumaca)}
.sem-sinal[hidden]{display:none}
@keyframes respirar{0%,100%{opacity:.5}50%{opacity:1}}

@keyframes pulso{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes piscar{0%,9%{opacity:1}10%,17%{opacity:.2}18%,32%{opacity:1}33%,39%{opacity:.55}40%,100%{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .marca::after{animation:none;opacity:.7}
  .piscar,.lider{animation:none}
}
</style>
</head>
<body class="heroi">
<div class="app">
  <header class="topo">
    <img class="logo" src="logo-atos-one.png" alt="Atos One">
    <h1 class="marca" id="titulo" data-texto="BLACKOUT">BLACKOUT</h1>
  </header>

  <section class="tela mensagem" data-id="lider">
    <p class="mensagem-texto lider">Aguardando o líder…</p>
    <p class="mensagem-texto sem-sinal" id="sem-sinal" hidden>Sem conexão. Tentando de novo…</p>
  </section>

  <section class="tela votar" data-id="votar" hidden>
    <form id="form-voto" novalidate>
      <h2 class="chamada" id="chamada">Qual assunto vamos encarar hoje?</h2>
      <p class="relogio-chip"><strong id="tempo-votar">0:00</strong> para votar</p>
      <div class="opcoes" id="opcoes" role="radiogroup" aria-labelledby="chamada"></div>
      <div class="acao">
        <button class="botao" id="btn-votar" type="submit" disabled>Escolha um tema</button>
        <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
      </div>
    </form>
  </section>

  <section class="tela mensagem" data-id="votado" hidden>
    <p class="mensagem-titulo">Voto feito</p>
    <p class="frase" id="frase"></p>
  </section>
</div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var URL_SCRIPT = (window.BLACKOUT_APPS_SCRIPT || "").trim();

  // ---------- logo: se o arquivo não existir, mostra o nome em texto ----------
  document.querySelectorAll("img.logo").forEach(function (img) {
    var trocar = function () { var s = document.createElement("span"); s.className = "logo-texto"; s.textContent = "Atos One"; img.replaceWith(s); };
    if (img.complete && img.naturalWidth === 0) trocar(); else img.addEventListener("error", trocar);
  });

  var guarda = {
    ler: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    gravar: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // Código anônimo do aparelho, só para não contar voto duplicado na planilha
  var aparelho = guarda.ler("blackout_aparelho");
  if (!aparelho) {
    aparelho = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    guarda.gravar("blackout_aparelho", aparelho);
  }

  var estado = { fase: "aguardando" };
  var desvio = 0;              // diferença entre o relógio do Google e o do celular
  var falhas = 0;
  var chaveMontada = "";
  var selecionado = null;
  var enviando = false;
  var telaVisivel = "";
  var timerBusca = null;

  var fimLocal = function () { return estado.fim ? estado.fim - desvio : 0; };
  var aberta = function () { return estado.fase === "aberta" && Date.now() < fimLocal(); };
  var chaveVoto = function () { return "blackout_voto_" + (estado.rodada || ""); };
  var jaVotou = function () { return guarda.ler(chaveVoto()) !== null; };

  function formatar(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function ajustar(el) {
    if (!el || el.getClientRects().length === 0) return;
    el.style.fontSize = "";
    for (var i = 0; i < 4; i++) {
      if (el.scrollWidth - el.clientWidth <= 1) break;
      var fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = (fs * el.clientWidth / el.scrollWidth * 0.97) + "px";
    }
  }

  function telaAtual() {
    if (!aberta()) return "lider";
    return jaVotou() ? "votado" : "votar";
  }

  // Monta as opções quando chega uma rodada nova
  function montar() {
    var chave = estado.fase === "aberta" ? estado.rodada + "|" + (estado.temas || []).join("|") : "";
    var titulo = estado.titulo || "BLACKOUT";
    var t = $("#titulo");
    if (t.textContent !== titulo) { t.textContent = titulo; t.dataset.texto = titulo; document.title = titulo; ajustar(t); }
    if (chave === chaveMontada) return;
    chaveMontada = chave;
    $("#chamada").textContent = estado.chamada || "Qual assunto vamos encarar hoje?";
    $("#frase").textContent = estado.frase || "";
    var caixa = $("#opcoes");
    caixa.textContent = "";
    selecionado = null;
    (estado.temas || []).forEach(function (nome, i) {
      var rotulo = document.createElement("label");
      rotulo.className = "opcao";
      var entrada = document.createElement("input");
      entrada.type = "radio"; entrada.name = "tema"; entrada.value = String(i);
      var lampada = document.createElement("span"); lampada.className = "lampada"; lampada.setAttribute("aria-hidden", "true");
      var texto = document.createElement("span"); texto.className = "opcao-nome"; texto.textContent = nome;
      rotulo.appendChild(entrada); rotulo.appendChild(lampada); rotulo.appendChild(texto);
      caixa.appendChild(rotulo);
    });
    aviso("");
    atualizarBotao();
  }

  function aviso(txt) { $("#aviso").textContent = txt || ""; }

  function atualizarBotao() {
    var b = $("#btn-votar");
    b.disabled = selecionado === null || enviando;
    b.textContent = enviando ? "Enviando…" : selecionado !== null ? "Confirmar voto" : "Escolha um tema";
  }

  function atualizar() {
    var tela = telaAtual();
    if (tela !== telaVisivel) {
      var eraVotacao = telaVisivel === "votar" || telaVisivel === "votado";
      telaVisivel = tela;
      document.querySelectorAll(".tela").forEach(function (s) { s.hidden = s.dataset.id !== tela; });
      document.body.classList.toggle("heroi", tela !== "votar");
      window.scrollTo(0, 0);
      ajustar($("#titulo"));
      if (eraVotacao && tela === "lider") buscarLogo();   // acabou o tempo: volta a consultar
    }
    if (tela === "votar") $("#tempo-votar").textContent = formatar(fimLocal() - Date.now());
    $("#sem-sinal").hidden = falhas < 3;
  }

  // ---------- consulta ao Apps Script ----------
  function agendar() {
    clearTimeout(timerBusca);
    var ms;
    if (aberta()) ms = Math.min(15000, Math.max(1500, fimLocal() - Date.now() + 800));
    else ms = 4000 + Math.random() * 2500;
    if (falhas) ms = Math.min(20000, ms + falhas * 2000);
    timerBusca = setTimeout(buscar, ms);
  }
  function buscarLogo() { clearTimeout(timerBusca); timerBusca = setTimeout(buscar, 300 + Math.random() * 1500); }

  function buscar() {
    if (document.hidden || !URL_SCRIPT) { agendar(); return; }
    var t0 = Date.now();
    fetch(URL_SCRIPT + "?_=" + t0, { redirect: "follow", cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok || !j.estado) throw new Error("resposta");
        var t1 = Date.now();
        if (typeof j.agora === "number") desvio = j.agora - (t0 + t1) / 2;
        falhas = 0;
        estado = j.estado;
        montar();
        atualizar();
      })
      .catch(function () { falhas++; atualizar(); })
      .then(agendar);
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden) buscarLogo(); });

  $("#opcoes").addEventListener("change", function (ev) {
    if (ev.target.name !== "tema") return;
    selecionado = Number(ev.target.value);
    document.querySelectorAll(".opcao").forEach(function (o) { o.classList.toggle("marcada", o.querySelector("input").checked); });
    aviso("");
    atualizarBotao();
  });

  // ---------- envio do voto ----------
  function postar(corpo) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    return fetch(URL_SCRIPT, { method: "POST", body: JSON.stringify(corpo), redirect: "follow", signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json(); })
      .finally(function () { clearTimeout(timer); });
  }

  function registrado(nome, chave) {
    guarda.gravar(chave, nome);
    enviando = false; aviso(""); atualizarBotao(); atualizar();
  }

  $("#form-voto").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (selecionado === null || enviando || !aberta()) return;
    var nome = estado.temas[selecionado];
    var chave = chaveVoto();
    var corpo = { acao: "votar", rodada: estado.rodada, tema: nome, aparelho: aparelho };
    enviando = true; aviso(""); atualizarBotao();
    var tentativas = 0;
    (function tentar() {
      tentativas++;
      postar(corpo).then(function (j) {
        if (j && (j.ok || j.erro === "encerrada")) registrado(nome, chave);
        else throw new Error((j && j.erro) || "resposta");
      }).catch(function () {
        if (!aberta()) { enviando = false; atualizarBotao(); atualizar(); return; }
        if (tentativas < 3) { setTimeout(tentar, 1500); return; }
        enviando = false; atualizarBotao();
        aviso("Não deu para enviar. Confira o sinal e toque em Confirmar voto de novo.");
      });
    })();
  });

  function tremidaAleatoria() {
    var reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduz && document.body.classList.contains("heroi")) {
      var m = $("#titulo");
      m.classList.remove("piscar"); void m.offsetWidth; m.classList.add("piscar");
    }
    setTimeout(tremidaAleatoria, 5000 + Math.random() * 9000);
  }
  setTimeout(tremidaAleatoria, 3000);

  window.addEventListener("resize", function () { ajustar($("#titulo")); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ajustar($("#titulo")); });

  atualizar();
  buscar();
  setInterval(atualizar, 250);
})();
</script>
</body>
</html>
